name: Verify
on:
  workflow_call:
  pull_request:
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  types-and-relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace app
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:configure
      - run: npx expo export --platform ios
        working-directory: app
  native:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx expo prebuild --platform ios --no-install
        working-directory: app
      - run: pod install
        working-directory: app/ios
      - name: Compile app and extension on hosted macOS
        run: xcodebuild -workspace AgentCompanion.xcworkspace -scheme AgentCompanion -sdk iphonesimulator -configuration Release -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- ARCHS=arm64 ONLY_ACTIVE_ARCH=YES -derivedDataPath "$RUNNER_TEMP/agent-derived" build
        working-directory: app/ios
      - name: Launch the release app in a hosted iPhone simulator
        shell: bash
        run: |
          device=$(xcrun simctl list devices available -j | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const devices=Object.entries(JSON.parse(s).devices).filter(([runtime])=>runtime.includes("iOS-26")).flatMap(([,devices])=>devices);const phone=devices.find(d=>d.name.startsWith("iPhone"));if(!phone)process.exit(1);console.log(phone.udid);})')
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$RUNNER_TEMP/agent-derived/Build/Products/Release-iphonesimulator/AgentCompanion.app"
          mkdir -p "$RUNNER_TEMP/agent-evidence"
          xcrun simctl launch --stdout="$RUNNER_TEMP/agent-evidence/stdout.log" --stderr="$RUNNER_TEMP/agent-evidence/stderr.log" "$device" com.example.agentcompanion
          sleep 12
          mkdir -p "$RUNNER_TEMP/agent-evidence"
          xcrun simctl io "$device" screenshot "$RUNNER_TEMP/agent-evidence/first-launch.png"
          xcrun simctl spawn "$device" log show --last 3m --style compact --predicate 'process == "AgentCompanion" OR eventMessage CONTAINS "com.example.agentcompanion"' > "$RUNNER_TEMP/agent-evidence/system.log" 2>&1 || true
          find "$HOME/Library/Logs/DiagnosticReports" "$HOME/Library/Developer/CoreSimulator/Devices/$device/data/Library/Logs" -name 'AgentCompanion*' -type f -exec cp {} "$RUNNER_TEMP/agent-evidence/" \; || true
          xcrun simctl spawn "$device" launchctl list | grep com.example.agentcompanion
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-simulator-evidence
          path: ${{ runner.temp }}/agent-evidence
          if-no-files-found: ignore
